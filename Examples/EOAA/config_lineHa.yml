--- 
# Input line config
lines:
  - name: NII6585 #name of the line
    wave: 6585.27  #central wavelenght 
  - name: NII6549 #name of the line
    wave: 6549.86  #central wavelenght 
    fac_Name: NII6585 #Name of the Amplitude line to be constrained
    fac: 2.93 #1/x factor of proportionality
    fwh_Name: NII6585 #Name of the FWHM of the line to be constrained with
    fwhF: 1.0
    vel_Name: NII6585 #Name of the velocity shift of the line to be constrained with
    velF: 1.0
  - name: HaNarrow #name of the line
    wave: 6564.61  #central wavelenght 
    fwh_Name: NII6585 #Name of the FWHM of the line to be constrained with
    fwhF: 1.0
    vel_Name: NII6585 #Name of the velocity shift of the line to be constrained with
    velF: 1.0  
  - name: SII6718 #name of the line
    wave: 6718.29  #central wavelenght 
    fwh_Name: NII6585 #Name of the FWHM of the line to be constrained with
    fwhF: 1.0
    vel_Name: NII6585 #Name of the velocity shift of the line to be constrained with
    velF: 1.0
  - name: SII6732 #name of the line
    wave: 6732.67  #central wavelenght 
    fwh_Name: NII6585 #Name of the FWHM of the line to be constrained with
    fwhF: 1.0
    vel_Name: NII6585 #Name of the velocity shift of the line to be constrained with
    velF: 1.0
#  - name: HaBroad #name of the line
#    wave: 6564.61  #central wavelenght

continum:
  - region: Halpha
    wave1: 6490.0
    wave2: 6510.0    
priors:
  Ao0: 0.6 #initial amplitud value of the narrow line
  As0: 5017.8 #maximum amplitud limit of the narrow line
  Ai0: 0.0 #minimum amplitud limit of the narrow line
  Ao1: 0.09 #initial amplitud value of the 2dnarrow line 
  As1: 5017.8 #maximum amplitud limit of the 2dnarrow line
  Ai1: 0.0 #minimum amplitud limit of the 2dnarrow line
  Ao2: 0.04 #initial amplitud value of the 3dnarrow line
  As2: 5027.8 #maximum amplitud limit of the 3dnarrow line
  Ai2: 0.0 #minimum amplitud limit of the 3dnarrow line
  Ao3: 0.09 #initial amplitud value of the 4dnarrow line 
  As3: 5017.8 #maximum amplitud limit of the 4dnarrow line
  Ai3: 0.0 #minimum amplitud limit of the 4dnarrow line
  Ao4: 0.04 #initial amplitud value of the 5dnarrow line
  As4: 5027.8 #maximum amplitud limit of the 5dnarrow line
  Ai4: 0.0 #minimum amplitud limit of the 5dnarrow line
#  Ao5: 0.04 #initial amplitud value of the brad line
#  As5: 27.8 #maximum amplitud limit of the broad line
#  Ai5: 0.0 #minimum amplitud limit of the broad line  
  fwhmo0: 150.0 #initial fwhm value of the narrow line
  fwhms0: 800.0 #maximum fwhm limit of the narrow line
  fwhmi0: 50.0 #minimum fwhm limit of the narrow line
  fwhmo1: 150.0 #initial fwhm value of the 2dnarrow line
  fwhms1: 800.0 #maximum fwhm limit of the 2dnarrow line
  fwhmi1: 50.0 #minimum fwhm limit of the 2dnarrow line
  fwhmo2: 150.0 #initial fwhm value of the 3dnarrow line
  fwhms2: 800.0 #maximum fwhm limit of the 3dnarrow line
  fwhmi2: 50.0 #minimum fwhm limit of the 3dnarrow line
  fwhmo3: 150.0 #initial fwhm value of the 4dnarrow line
  fwhms3: 800.0 #maximum fwhm limit of the 4dnarrow line
  fwhmi3: 50.0 #minimum fwhm limit of the 4dnarrow line
  fwhmo4: 150.0 #initial fwhm value of the 5dnarrow line
  fwhms4: 800.0 #maximum fwhm limit of the 5dnarrow line
  fwhmi4: 50.0 #minimum fwhm limit of the 5dnarrow line
#  fwhmo5: 1000.0 #initial fwhm value of the broad line
#  fwhms5: 10500.0 #maximum fwhm limit of the broad line
#  fwhmi5: 700.0 #minimum fwhm limit of the broad line
  dvo0: 0.0 #initial velocity value of the narrow line
  dvs0: 300.0 #maximum velocity limit of the narrow line
  dvi0: -300.0 #minimum velocity limit of the narrow line
  dvo1: 0.0 #initial velocity value of the 2dnarrow line
  dvs1: 300.0 #maximum velocity limit of the 2dnarrow line
  dvi1: -300.0 #minimum velocity limit of the 2dnarrow line0
  dvo2: 0.0 #initial velocity value of the 3dnarrow line
  dvs2: 300.0 #maximum velocity limit of the 3dnarrow line
  dvi2: -300.0 #minimum velocity limit of the 3dnarrow line
  dvo3: 0.0 #initial velocity value of the 4dnarrow line
  dvs3: 300.0 #maximum velocity limit of the 4dnarrow line
  dvi3: -300.0 #minimum velocity limit of the 4dnarrow line0
  dvo4: 0.0 #initial velocity value of the 5dnarrow line
  dvs4: 300.0 #maximum velocity limit of the 5dnarrow line
  dvi4: -300.0 #minimum velocity limit of the 5dnarrow line 
#  dvo5: -20.0 #initial velocity value of the broad line
#  dvs5: 1000.0 #maximum velocity limit of the broad line
#  dvi5: -1000.0 #minimum velocity limit of the broad line  
  P1o: 0.01
  P1s: 1000.0
  P1i: 0.0
  P2o: 1
  P2s: 10
  P2i: -4
...