--- 
# config file to create a single VP cube
vpcube:
  # Single cube generation
  - survey_type: virusP #Cube Survey Type
    name_list: [Name1,Name2] #list of input observation pointings
    out_path: out_cubes/ #path of the output cube files
    redux_dir: '' #path of the redux RSP dir
    fib: 4.16 #Fiber diameter of VirusP, default value 4.16 arcsec
    sigm_s: 4.16 #smoth kernel size used to reconstruct the cube, default is the fiber diameter size
    pix_s: 0.0 #spaxel size used to reconstruct the cube, default set to 0 to fix it to 0.75*sigm_s
    alph_s: 2.0 #kernel "shape" factor, a value equal of 2 returns a Gaussian kerner, larger than 2 returns a sharper kernel
    flu16: True #keyword to return a cube with units of 10^{-16} erg/s/cm2/A, if False, the units are erg/s/cm2/A
    nameF: NameF #output root name of the data cube
    spec_range: [0,0] #optional, spectral range for the output cube, set to [0,0] to use the full spectral range
    base_nameWCS: NAME_wcs.txt #base name of the WCS file
    basename: NAME_abscal_HST.fits #base name of the RSS file
    basenameC: vpCube-NAME.fits #base name of the final output cube file
    errors: True #activate or deactivate the error estimation
    fac_sizey: 1.1 #factor of the FoV in Y
    fac_sizex: 1.1 #factor of the FoV in X
    radvel: True #activate the heliocentric correction 
...